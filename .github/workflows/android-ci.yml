name: Android CI

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-ci.yml"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This repo doesn't have committed Gradle wrapper files (gradlew /
      # gradlew.bat) - normally you'd use `./gradlew` here so CI runs the
      # exact same Gradle version as local dev. Since that wrapper isn't
      # present, this provisions a pinned Gradle version directly instead,
      # which keeps CI working regardless of local wrapper state. If a
      # wrapper gets committed later (see the README note on this), switch
      # the `gradle` calls below to `./gradlew` for stricter version parity.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint
        run: gradle lintDebug

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
